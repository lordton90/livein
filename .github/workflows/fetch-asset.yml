name: fetch-asset

on:
  workflow_dispatch:
    inputs:
      url:
        description: Source URL to download
        required: true
        type: string
      path:
        description: Repo-relative path to save the file to
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit asset
        env:
          URL_IN: ${{ inputs.url }}
          PATH_IN: ${{ inputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PATH_IN")"
          curl -sSL --retry 3 "$URL_IN" -o "$PATH_IN"
          ls -la "$PATH_IN"
          git config user.name "asset-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$PATH_IN"
          git commit -m "Add fetched asset: $PATH_IN"
          git push
