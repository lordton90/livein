name: fetch-batch

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: JSON array of {url, path} objects
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit assets
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          echo "$MANIFEST" | jq -c '.[]' | while read -r item; do
            url=$(echo "$item" | jq -r .url)
            path=$(echo "$item" | jq -r .path)
            mkdir -p "$(dirname "$path")"
            curl -sSL --retry 3 -A "Mozilla/5.0 (X11; Linux x86_64) Chrome/120" "$url" -o "$path"
            ls -la "$path"
          done
          git config user.name "asset-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add fetched batch assets"
          git push
